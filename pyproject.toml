[project]
name = "finwatch"
version = "0.2.0"
description = "Open-source filing intelligence for self-directed investors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "finwatch contributors" }]
keywords = ["sec", "edgar", "xbrl", "filings", "investing", "portfolio"]
dependencies = [
    # Tier 1 trust layer requires only pydantic; CLI/config need typer + rich.
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    # Phase 1: EDGAR/Stooq HTTP client with retry/backoff.
    "httpx>=0.27",
    "tenacity>=8",
    # Phase 2: fast HTML section parsing for the P0 preprocessor.
    "selectolax>=0.3",
    # Phase 5: provider-agnostic LLM router for the P1/P2 stages.
    # Capped: releases from 1.100 add boto3 and other transitive packages this app never
    # uses. pip-audit still reports one advisory against this range (GHSA-7hp6-4w63-5g45);
    # it concerns the LiteLLM proxy server, which finwatch does not run. Raise the cap
    # deliberately, after checking what a new release pulls in.
    "litellm>=1.95.1,<1.96",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "uvicorn>=0.30",
]

# Heavier, phase-specific dependencies from the approved Tech Stack (CLAUDE.md §4)
# are added at the phase that first needs them (all pre-approved, ask before others):
# edgartools (approved) is available if richer filing parsing is ever needed.

[project.scripts]
finwatch = "finwatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: tests that hit live network / LLM APIs (excluded by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Trust-layer files are kept dense and hand-formatted; exclude them from lint reflow so a
# cosmetic autofix never touches the deterministic core. Editable with care (see CLAUDE.md).
extend-exclude = [
    "src/finwatch/core/types.py",
    "src/finwatch/metrics/envelope.py",
    "src/finwatch/xbrl/normalize.py",
    "src/finwatch/metrics/formulas.py",
    "src/finwatch/verify/checks.py",
    "tests/test_verifier_mutations.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
